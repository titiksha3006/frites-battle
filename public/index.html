<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇧🇪 Frites Battle</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #f5f1e8;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #222;
    }

    .card {
      width: min(90%, 560px);
      background: white;
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 12px 40px #0002;
      text-align: center;
    }

    h1 {
      margin: 5px 0;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .sauces {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 2px solid #ddd;
      background: white;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
    }

    button:active {
      transform: scale(.97);
    }

    #results {
      margin-top: 28px;
      text-align: left;
    }

    .result {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #eee;
    }

    .winner {
      font-weight: bold;
      font-size: 18px;
    }

    #message {
      margin-top: 18px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="card">

  <div style="font-size:45px">🍟🇧🇪</div>

  <h1>Frites Battle</h1>

  <div class="subtitle">
    Belgium has many important problems.<br>
    This is the most important one.
  </div>

  <p><strong>Which sauce belongs on Belgian fries?</strong></p>

  <div class="sauces">
    <button onclick="vote('Andalouse')">Andalouse</button>
    <button onclick="vote('Samouraï')">Samouraï</button>
    <button onclick="vote('Mayonnaise')">Mayonnaise</button>
    <button onclick="vote('Tartare')">Tartare</button>
    <button onclick="vote('Stoofvleessaus')">Stoofvleessaus</button>
  </div>

  <div id="message"></div>

  <div id="results"></div>

</div>

<script>

async function loadResults() {
  const response = await fetch("/api/results");
  const results = await response.json();

  const total = results.reduce((sum, r) => sum + r.votes, 0);

  document.getElementById("results").innerHTML =
    "<h3>🏆 Current ranking</h3>" +
    (results.length
      ? results.map((r, i) => `
        <div class="result ${i === 0 ? "winner" : ""}">
          <span>${i === 0 ? "👑 " : ""}${r.sauce}</span>
          <span>${r.votes}</span>
        </div>
      `).join("")
      : "<p>No votes yet. Be the first!</p>"
    ) +
    `<p style="color:#777;font-size:13px">${total} total votes</p>`;
}

async function vote(sauce) {

  const response = await fetch("/api/vote", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ sauce })
  });

  if (response.ok) {
    document.getElementById("message").textContent =
      `🇧🇪 Vote recorded for ${sauce}!`;

    loadResults();
  }
}

loadResults();

</script>

</body>
</html>
